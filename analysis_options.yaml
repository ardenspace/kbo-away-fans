# Lint 기준선 — flutter analyze 경고 0을 유지한다.
# 규칙을 완화하려면 근거를 커밋 메시지에 남길 것.

include: package:flutter_lints/flutter.yaml

analyzer:
  # iOS Swift Package Manager 가 build/ios/SourcePackages 아래로 의존성
  # 소스(예: firebase example)를 체크아웃하면 분석 대상에 끌려 들어온다 —
  # 빌드 산출물은 lint 기준선 대상이 아니다.
  exclude:
    - build/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - prefer_single_quotes
    - always_declare_return_types
    - avoid_print
    - directives_ordering
    - prefer_final_locals
    - require_trailing_commas
    - unawaited_futures
