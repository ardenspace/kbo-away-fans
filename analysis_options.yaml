# Lint 기준선 — flutter analyze 경고 0을 유지한다.
# 규칙을 완화하려면 근거를 커밋 메시지에 남길 것.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - prefer_single_quotes
    - always_declare_return_types
    - avoid_print
    - directives_ordering
    - prefer_final_locals
    - require_trailing_commas
    - unawaited_futures
