name: kbo_away_fans
description: "KBO 원정 팬을 위한 구장 주변 가이드 앱."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  firebase_analytics: ^12.5.0
  firebase_core: ^4.14.0
  flutter:
    sdk: flutter
  flutter_naver_map: ^1.4.4
  flutter_riverpod: ^3.4.2
  http: ^1.6.0
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # 스플래시 연출용 — seam_top/seam_bottom 은 야구공 실밥 원화를 위/아래로
    # 자른 두 조각이고(가운데 빈 구간은 버렸다), logo.png 는 배경을 투명하게
    # 뺀 워드마크다. 원화는 저장소에 두지 않으므로 다시 자르려면 원본이 필요하다.
    - assets/splash/
