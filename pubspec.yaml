name: kbo_away_fans
description: "KBO 원정 팬을 위한 구장 주변 가이드 앱."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  firebase_analytics: ^12.5.0
  firebase_core: ^4.14.0
  flutter:
    sdk: flutter
  flutter_naver_map: ^1.4.4
  flutter_riverpod: ^3.4.2
  http: ^1.6.0
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# 런처 아이콘 생성 — 소스 한 장에서 iOS·Android 전 사이즈를 만든다.
# 아이콘을 갈아끼울 때는 assets/icon/app_icon.png 를 바꾸고
# `dart run flutter_launcher_icons` 를 다시 돌린다.
#
# 주의: 0.14.4 는 실행할 때마다 project.pbxproj 의
# ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS 값을 YES 에서
# AppIcon 으로 잘못 덮어쓴다 (설정하려던 키는 ASSETCATALOG_COMPILER_APPICON_NAME
# 이고 그쪽은 이미 올바르게 들어 있다). 돌린 뒤 pbxproj diff 를 보고 그 두 줄은
# YES 로 되돌린다.
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  ios: true
  android: true
  # iOS 아이콘은 알파 채널이 있으면 검게 렌더되므로 배경을 스플래시와
  # 같은 오프화이트로 채운다 (ColorTokens.splashBackground).
  remove_alpha_ios: true
  background_color_ios: "#F1F0EF"
  # Android 8 이상은 런처 아이콘을 배경·전경 두 장으로 받아 기기마다 다른
  # 모양(원·스쿼클·물방울)으로 잘라낸다. 한 장짜리로 두면 시스템이 통째로
  # 축소해 원 안에 넣어 심볼이 작아지므로 두 장을 따로 준다. 전경은 잘려
  # 나가는 바깥을 감안해 심볼을 캔버스의 60% 로 앉힌 그림이다.
  adaptive_icon_background: "#F5F4F3"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png

flutter:
  uses-material-design: true

  assets:
    # 스플래시 연출용 — seam_top/seam_bottom 은 야구공 실밥 원화를 위/아래로
    # 자른 두 조각이고(가운데 빈 구간은 버렸다), logo.png 는 배경을 투명하게
    # 뺀 워드마크다. 원화는 저장소에 두지 않으므로 다시 자르려면 원본이 필요하다.
    - assets/splash/
