name: kbo_away_fans
description: "KBO 원정 팬을 위한 구장 주변 가이드 앱."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cloud_firestore: ^6.9.0
  cloud_functions: ^6.4.0
  firebase_analytics: ^12.5.0
  firebase_app_check: ^0.4.7
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  flutter:
    sdk: flutter
  flutter_naver_map: ^1.4.4
  flutter_riverpod: ^3.4.2
  # 좌표를 읽는 플러그인 (step 4.1 구장 방문 판정). MIT · 무료이고 pub.dev
  # 점수 160/160, `permission_handler` 와 같은 Baseflow 계열이라 이미 이
  # 저장소가 쓰는 플러그인들과 같은 무료·오픈소스 계열이다 (2.5 가 "4.1·5.2 가
  # 좌표를 쓸 때 별도로 판단"으로 미뤄 둔 자리 — decisions.md 2026-09-04 [S]).
  # 안드로이드·iOS 의 위치 권한 선언은 2.5 가 이미 넣어 두었으므로 이
  # 플러그인이 새로 요구하는 플랫폼 설정은 없다. import 는
  # `lib/location/visit_check.dart` 한 파일에만 두고
  # `scripts/hooks/check-firebase-import-boundary.sh` 가 그 경계를 지킨다.
  geolocator: ^14.0.3
  google_sign_in: ^7.2.0
  http: ^1.6.0
  kakao_flutter_sdk_user: ^2.0.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  # 인증 탐침(test/backend/firebase_auth_*_probe_test.dart)이 `FirebaseAuthService`
  # **그 자체**를 돌리려고 플랫폼 인터페이스를 갈아 끼운다. 앱 코드는 이 둘을
  # 쓰지 않으므로 dev 쪽에만 둔다 (firebase_auth·firebase_core 가 이미 끌어오는
  # 것이라 새로 받아 오는 패키지는 없고, 여기 적어야 analyze 의
  # depend_on_referenced_packages 가 조용하다).
  firebase_auth_platform_interface: ^9.0.7
  firebase_core_platform_interface: ^8.1.1
  # 같은 까닭으로 App Check 도 — `test/backend/app_check_activation_test.dart` 가
  # 플랫폼 인터페이스를 갈아 끼워 `BackendAppCheck` **그 자체**를 돌린다
  # (배선이 통째로 사라져도 나머지 시험은 전부 초록불이라, 그 사실을 잡는 자리가
  # 없으면 App Check 은 "적혀 있다"까지만 검증된다). `firebase_app_check` 이 이미
  # 끌어오는 패키지라 새로 받아 오는 것은 없다.
  firebase_app_check_platform_interface: ^0.4.2+1
  # `test/backend/user_data_firestore_store_test.dart` 가 `FirestoreUserDataStore`
  # **그 자체**를 돌리려고 SDK 자리에 끼우는 가짜 Firestore. 이 자리가 서기
  # 전까지 저장소 구현은 어느 줄을 망가뜨려도 `flutter test` 가 전부 초록불이었다
  # (앱 쪽 대역 `test/backend/fake_backend.dart` 는 같은 규칙의 **사본**이라
  # 구현이 어긋나도 사본은 멀쩡하다). 트랜잭션·`update` 의 부분 갱신·스냅샷
  # 스트림을 실 SDK 와 같은 의미로 돌려 주는 것이 이 패키지의 몫이고, 규칙이
  # payload 를 받아 주는지는 에뮬레이터(`firebase/test/`)가 따로 잰다.
  fake_cloud_firestore: ^4.2.0
  # `test/location/device_permission_handler_gateway_test.dart` 가
  # `DevicePermissionHandlerGateway` **그 자체**를 돌리려고 위치 권한 플러그인의
  # 플랫폼 인터페이스를 갈아 끼운다 (같은 까닭·같은 방식의 선례가 위 셋이다).
  # 이 자리가 서기 전에는 실 구현의 어느 줄을 바꿔도 — 묻는 권한을 "항상
  # 허용"으로 바꾸는 것까지 — 시험이 전부 초록불이었다. `permission_handler` 가
  # 이미 끌어오는 패키지라 새로 받아 오는 것은 없다.
  permission_handler_platform_interface: ^4.4.0
  # 같은 까닭으로 좌표 플러그인도 —
  # `test/location/stadium_visit_fix_contract_test.dart` 가 플랫폼 인터페이스를
  # 갈아 끼워 `visit_check.dart` 의 private 측위 함수(`_readDeviceFix`)를 **그
  # 자체로** 돌린다. 그 자리가 서기 전에는 바깥 `.timeout` 을 지워도,
  # `catch (_)` 를 좁혀 SDK 예외가 새게 해도 시험 644개가 전부 초록불이었다.
  # 이 방식을 고른 것은 좌표를 얻는 새 공개 이음매를 만들지 않기 위해서다
  # (decisions.md 2026-09-04 [S]). `geolocator` 가 이미 끌어오는 패키지라
  # 새로 받아 오는 것은 없다.
  geolocator_platform_interface: ^4.3.0
  # 같은 시험의 "플랫폼이 영영 답하지 않는 실행"을 재려면 시간을 밀어야 한다 —
  # 위젯 시험이 아니라 `tester.pump` 가 없다. `flutter_test` 가 이미 끌어오는
  # 패키지라 새로 받아 오는 것은 없다.
  fake_async: ^1.3.3

# 런처 아이콘 생성 — 소스 한 장에서 iOS·Android 전 사이즈를 만든다.
# 아이콘을 갈아끼울 때는 assets/icon/ 의 원본을 바꾸고
# `scripts/regen_icons.sh` 를 돌린다. (`dart run flutter_launcher_icons` 를
# 직접 돌리면 0.14.4 버그로 pbxproj 가 망가진다 — 자세한 내용은 스크립트 주석 참조.)
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  ios: true
  android: true
  # iOS 아이콘은 알파 채널이 있으면 검게 렌더되므로 알파를 제거한다.
  # 원화(app_icon.png)가 이미 불투명이라 배경색은 평소엔 효과가 없지만,
  # 원화에 알파가 생겼을 때 엉뚱한 색이 깔리지 않도록 원화 바탕과 같은
  # 오프화이트로 맞춰 둔다.
  remove_alpha_ios: true
  background_color_ios: "#F5F4F3"
  # Android 8 이상은 런처 아이콘을 배경·전경 두 장으로 받아 기기마다 다른
  # 모양(원·스쿼클·물방울)으로 잘라낸다. 한 장짜리로 두면 시스템이 통째로
  # 축소해 원 안에 넣어 심볼이 작아지므로 두 장을 따로 준다. 전경은 자동
  # 생성되지 않아 따로 그린다: 원형 마스크가 보여 주는 영역은 캔버스 가운데
  # 66.7% (72/108dp) 이고 잘리지 않는 안전 영역은 61% (66/108dp) 이므로,
  # 심볼 높이를 캔버스의 61% 에 맞춰 정중앙에 앉힌 투명 배경 그림이어야 한다.
  adaptive_icon_background: "#F5F4F3"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png

flutter:
  uses-material-design: true

  assets:
    # 소셜 로그인 제공자가 배포한 공식 브랜드 자산.
    - assets/auth/
    # 스플래시 연출용 — seam_top/seam_bottom 은 야구공 실밥 원화를 위/아래로
    # 자른 두 조각이고(가운데 빈 구간은 버렸다), logo.png 는 배경을 투명하게
    # 뺀 워드마크다. 원화는 저장소에 두지 않으므로 다시 자르려면 원본이 필요하다.
    - assets/splash/
