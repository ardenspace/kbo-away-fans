# CI — 검증만 한다. 배포는 deploy-content.yml, 크롤은 crawl-schedule.yml 담당.
#
# scripts/hooks/ 의 두 검사를 여기서 한 번 더 도는 이유: 그 훅은
# `git config core.hooksPath scripts/hooks` 를 실행한 사람의 컴퓨터에서만 작동한다.
# 훅을 설정하지 않은 클론, `--no-verify` 커밋, 크론 워크플로의 봇 커밋은 전부 통과해
# 버린다. 로스터·토큰 규칙을 실제로 강제하려면 CI 가 마지막 관문이어야 한다.
#
# 비밀값은 필요 없다. 네트워크를 실제로 때리는 테스트
# (test/content/content_loader_live_test.dart) 는 환경 변수로만 켜지므로 기본 제외다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.3
          channel: stable
          cache: true

      - name: 의존성 설치
        run: flutter pub get

      - name: 정적 분석
        run: flutter analyze

      - name: 테스트
        run: flutter test

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: content-pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: content-pipeline/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 테스트
        run: npm test

  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 하드코딩된 디자인 값 검사
        run: bash scripts/hooks/check-hardcoded-values.sh

      - name: 공유 컴포넌트 로스터 동기화 검사
        run: bash scripts/hooks/check-registry-sync.sh
